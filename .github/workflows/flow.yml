name: flow

# The stack's shared flow checks, hosted by Wolfram (docs/flow.md there). Pinned
# to a Wolfram commit rather than main, and bumped deliberately, so a change in
# Wolfram cannot turn this repo red without a PR here.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  flow:
    uses: ewanc26/wolfram/.github/workflows/flow-reusable.yml@8a906e0860936a7f0cd27eb987b71ee1f9a16bea
    with:
      canon_ref: 8a906e0860936a7f0cd27eb987b71ee1f9a16bea
