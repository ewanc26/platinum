name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Repository flow: see CONTRIBUTING.md. The script is the single source of the
  # rules so that a developer can run exactly what CI runs.
  flow:
    name: Flow and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/check-flow.sh drift
      - name: Pull request title, body and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          tools/check-flow.sh title "$PR_TITLE"
          tools/check-flow.sh body "$RUNNER_TEMP/body.md"
          tools/check-flow.sh commits "$BASE_SHA..$HEAD_SHA"

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package.json
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The Mac OS 9 sources are a CodeWarrior-era C89 target that nothing else here
  # compiles: the bridge job is TypeScript, so a C99 construct or a modern libc
  # convenience would reach main unnoticed even though a CodeWarrior compiler
  # rejects both. The flags below mirror Wolfram's own Mac OS 9 CI job
  # deliberately, because the two targets have to accept the same dialect.
  # -pedantic-errors is stricter than CodeWarrior and turns GNU extensions into
  # hard errors.
  #
  # This is a dialect and logic check on a modern compiler. It is not a native
  # CodeWarrior build and it is not Classic Mac OS 9 hardware validation.
  macos9:
    name: Mac OS 9 sources (C89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only Wolfram's public headers are needed, so the dependency is the
      # released transport rather than a build of it. Bumping this ref is a
      # deliberate version change and has to update AGENTS.md and the README in
      # the same commit.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: v0.26.0
          path: wolfram

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      # Sources are compiled against the declaration-only SDK stubs in
      # macos9/test/sdk-stubs/, so this list is every source under macos9/ and
      # it grows as the UI half of the client is fixed. A file is listed only
      # once it actually compiles; see that directory's README for what a clean
      # run does and does not prove.
      - name: Assert the Mac sources still compile as strict C89
        run: |
          set -euo pipefail
          for f in \
            macos9/application.c \
            macos9/bridge_client.c \
            macos9/compose.c \
            macos9/config.c \
            macos9/json_min.c \
            macos9/main.c \
            macos9/notifications.c \
            macos9/pairing.c \
            macos9/preferences.c \
            macos9/profile.c \
            macos9/scrollbar.c \
            macos9/session.c \
            macos9/text_codec.c \
            macos9/timeline.c \
            macos9/ui.c \
            macos9/test/test_bridge_client.c \
            macos9/test/test_json_min.c
          do
            echo "--- $f"
            clang -std=c89 -pedantic-errors -Wall -Wextra \
              -Wno-unused-parameter -Werror \
              -Wdeclaration-after-statement -Wstrict-prototypes -Wvla \
              -I macos9 -I macos9/test/sdk-stubs -I wolfram/include \
              -c "$f" -o /dev/null
          done

      - name: Run the Mac-side tests
        # The transport itself cannot run here: it is built on Open Transport
        # and macTLS. These tests cover the client's own request building and
        # its handling of bridge responses by stubbing the Wolfram entry
        # points, which is what makes the pairing path testable at all.
        run: |
          set -euo pipefail
          CFLAGS=(
            -std=c89 -pedantic-errors -Wall -Wextra
            -Wno-unused-parameter -Werror
            -Wdeclaration-after-statement -Wstrict-prototypes -Wvla
            -I macos9 -I wolfram/include
          )
          clang "${CFLAGS[@]}" -o /tmp/test_json_min \
            macos9/json_min.c macos9/test/test_json_min.c
          /tmp/test_json_min
          clang "${CFLAGS[@]}" -o /tmp/test_bridge_client \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/test_bridge_client.c
          /tmp/test_bridge_client

  # The one check branch protection should require. Requiring the individual
  # jobs would let a renamed or added job silently drop out of the gate; this
  # job fails unless every job it needs succeeded, and the drift check fails if
  # a job is not listed here.
  gate:
    name: CI gate
    if: always()
    needs: [flow, bridge, macos9]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
