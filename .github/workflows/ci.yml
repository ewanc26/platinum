name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Repository flow: see CONTRIBUTING.md. The script is the single source of the
  # rules so that a developer can run exactly what CI runs.
  flow:
    name: Flow and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/check-flow.sh drift
      # Wolfram's update vectors, which the bridge's port must run unchanged.
      # The pin is a commit, bumped deliberately, like the transport ref below.
      # Labels, metadata, conventions and style are checked by flow.yml.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: 4ba931a37b0913e660fd54a8a569728c325ecc6e
          path: .wolfram-canon
          sparse-checkout: |
            test/vectors/update
      - name: The bridge's update vectors are Wolfram's, unchanged
        run: diff -ru .wolfram-canon/test/vectors/update bridge/test/vectors/update
      - run: tools/check-flow.sh duplication
      - name: Logo and icon are generated from one shape
        run: tools/gen-art.py --check
      - name: Parity matrix matches the code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/check-parity.sh

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package.json
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The Mac OS 9 sources are a CodeWarrior-era C89 target that nothing else here
  # compiles: the bridge job is TypeScript, so a C99 construct or a modern libc
  # convenience would reach main unnoticed even though a CodeWarrior compiler
  # rejects both. The flags below mirror Wolfram's own Mac OS 9 CI job
  # deliberately, because the two targets have to accept the same dialect.
  # -pedantic-errors is stricter than CodeWarrior and turns GNU extensions into
  # hard errors.
  #
  # This is a dialect and logic check on a modern compiler. It is not a native
  # CodeWarrior build and it is not Classic Mac OS 9 hardware validation.
  macos9:
    name: Mac OS 9 sources (C89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only Wolfram's public headers are needed, so the dependency is the
      # released transport rather than a build of it. Bumping this ref is a
      # deliberate version change and has to update AGENTS.md and the README in
      # the same commit.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: v0.26.0
          path: wolfram

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      # Sources are compiled against the declaration-only SDK stubs in
      # macos9/test/sdk-stubs/, so this list is every source under macos9/ and
      # it grows as the UI half of the client is fixed. A file is listed only
      # once it actually compiles; see that directory's README for what a clean
      # run does and does not prove.
      - name: Assert the Mac sources still compile as strict C89
        run: |
          set -euo pipefail
          for f in \
            macos9/application.c \
            macos9/bridge_client.c \
            macos9/compose.c \
            macos9/config.c \
            macos9/json_min.c \
            macos9/main.c \
            macos9/notifications.c \
            macos9/notifications_feed.c \
            macos9/pairing.c \
            macos9/preferences.c \
            macos9/profile.c \
            macos9/scrollbar.c \
            macos9/session.c \
            macos9/text_codec.c \
            macos9/timeline.c \
            macos9/ui.c \
            macos9/test/test_bridge_client.c \
            macos9/test/test_json_min.c \
            macos9/test/test_notifications.c \
            macos9/test/test_timeline.c \
            macos9/test/wolfram_stub.c
          do
            for cc in clang gcc; do
              echo "--- $cc $f"
              # -Wno-multichar: 'PTLM' and 'PREF' are OSType literals, which
              # are multi-character constants by design on the Mac target.
              "$cc" -std=c89 -pedantic-errors -Wall -Wextra \
                -Wno-unused-parameter -Wno-multichar -Werror \
                -Wdeclaration-after-statement -Wstrict-prototypes -Wvla \
                -I macos9 -I macos9/test/sdk-stubs -I wolfram/include \
                -c "$f" -o /dev/null
            done
          done

      - name: Run the Mac-side tests
        # The transport itself cannot run here: it is built on Open Transport
        # and macTLS. These tests cover the client's own request building and
        # its handling of bridge responses by stubbing the Wolfram entry
        # points, which is what makes the pairing path testable at all.
        run: |
          set -euo pipefail
          CFLAGS=(
            -std=c89 -pedantic-errors -Wall -Wextra
            -Wno-unused-parameter -Werror
            -Wdeclaration-after-statement -Wstrict-prototypes -Wvla
            -I macos9 -I wolfram/include
          )
          clang "${CFLAGS[@]}" -o /tmp/test_json_min \
            macos9/json_min.c macos9/test/test_json_min.c
          /tmp/test_json_min
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_bridge_client \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_bridge_client.c
          /tmp/test_bridge_client
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_timeline \
            macos9/timeline.c macos9/text_codec.c macos9/bridge_client.c \
            macos9/json_min.c macos9/test/wolfram_stub.c \
            macos9/test/test_timeline.c
          /tmp/test_timeline
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_notifications \
            macos9/notifications_feed.c macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_notifications.c
          /tmp/test_notifications

  # Builds the release inputs exactly as a real release would, publishes
  # nothing, and checks them with the updater's own parser, so the first real
  # release is one command. Releases themselves are paused (RELEASES_PAUSED).
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package.json
      - name: Build release inputs without tagging or publishing
        run: |
          version=$(node -p "require('./bridge/package.json').version")
          scripts/release.sh --dry-run "$version"
          (cd bridge && node --import tsx ../scripts/verify-release.mts "$version")

  # The one check branch protection should require. Requiring the individual
  # jobs would let a renamed or added job silently drop out of the gate; this
  # job fails unless every job it needs succeeded, and the drift check fails if
  # a job is not listed here.
  gate:
    name: CI gate
    if: always()
    needs: [flow, bridge, macos9, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
