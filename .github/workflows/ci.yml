name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Repository flow: see CONTRIBUTING.md. The script is the single source of the
  # rules so that a developer can run exactly what CI runs.
  flow:
    name: Flow and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/check-flow.sh drift
      # Wolfram's update and pairing vectors, which the bridge's ports must run unchanged.
      # The pin is a commit, bumped deliberately, like the transport ref below.
      # Labels, metadata, conventions and style are checked by flow.yml.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: bfb50126b2943741fc5bccc931aa20baa54e445a
          path: .wolfram-canon
          sparse-checkout: |
            test/vectors
      - name: The bridge's vectors are Wolfram's, unchanged
        run: |
          diff -ru .wolfram-canon/test/vectors/update bridge/test/vectors/update
          diff -u .wolfram-canon/test/vectors/oauth_pairing.json bridge/test/vectors/oauth_pairing.json
          diff -u .wolfram-canon/test/vectors/post_display.json bridge/test/vectors/post_display.json
          diff -u .wolfram-canon/test/vectors/ed25519.json bridge/test/vectors/ed25519.json
      - run: tools/check-flow.sh duplication
      - name: SDK stubs match the real Toolbox signatures
        run: tools/check-stubs.py
      - name: The Mac image test uses the bridge's image vectors
        run: tools/check-image-vectors.py
      - name: Logo and icon are generated from one shape
        run: tools/gen-art.py --check
      - name: Parity matrix matches the code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/check-parity.sh

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package.json

      # The bridge runs its update contract (manifest parsing, version
      # comparison, SHA-256, signature verification) in Wolfram's C through
      # Wolfram's Node addon (node/wolfram_core.c); the tests need the module.
      # The pin is a commit, bumped deliberately, like the transport ref in the
      # Mac OS 9 job below, and it appears in README.md and AGENTS.md.
      - name: Install the C toolchain for Wolfram's addon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libsecp256k1-dev
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: bfb50126b2943741fc5bccc931aa20baa54e445a
          path: wolfram
      - name: Build Wolfram's Node addon
        run: tools/build-addon.sh wolfram
        working-directory: ${{ github.workspace }}

      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The Mac OS 9 sources are a CodeWarrior-era C89 target that nothing else here
  # compiles: the bridge job is TypeScript, so a C99 construct or a modern libc
  # convenience would reach main unnoticed even though a CodeWarrior compiler
  # rejects both. The flags below mirror Wolfram's own Mac OS 9 CI job
  # deliberately, because the two targets have to accept the same dialect.
  # -pedantic-errors is stricter than CodeWarrior and turns GNU extensions into
  # hard errors.
  #
  # This is a dialect and logic check on a modern compiler. It is not a native
  # CodeWarrior build and it is not Classic Mac OS 9 hardware validation.
  macos9:
    name: Mac OS 9 sources (C89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only Wolfram's public headers are needed, so the dependency is the
      # released transport rather than a build of it. Bumping this ref is a
      # deliberate version change and has to update AGENTS.md and the README in
      # the same commit.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: v0.36.2
          path: wolfram

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc

      # Sources are compiled against the declaration-only SDK stubs in
      # macos9/test/sdk-stubs/, so this list is every source under macos9/ and
      # it grows as the UI half of the client is fixed. A file is listed only
      # once it actually compiles; see that directory's README for what a clean
      # run does and does not prove.
      - name: Assert the Mac sources still compile as strict C89
        run: |
          set -euo pipefail
          for f in \
            macos9/application.c \
            macos9/application_auth.c \
            macos9/application_menus.c \
            macos9/application_post.c \
            macos9/application_views.c \
            macos9/diag.c \
            macos9/diagwin.c \
            macos9/draft.c \
            macos9/drawutil.c \
            macos9/help.c \
            macos9/fixture.c \
            macos9/apppw.c \
            macos9/apppw_input.c \
            macos9/avatar_cache.c \
            macos9/bridge_client.c \
            macos9/compose.c \
            macos9/compose_model.c \
            macos9/config.c \
            macos9/image_blob.c \
            macos9/image_encode.c \
            macos9/image_pix.c \
            macos9/json_min.c \
            macos9/atproto_bootstrap.c \
            macos9/atproto_client.c \
            macos9/atproto_feed.c \
            macos9/atproto_identity.c \
            macos9/atproto_prefs.c \
            macos9/atproto_session.c \
            macos9/atproto_url.c \
            macos9/main.c \
            macos9/muted_words.c \
            macos9/conversations.c \
            macos9/conversations_feed.c \
            macos9/notifications.c \
            macos9/notifications_feed.c \
            macos9/pairing.c \
            macos9/post_media.c \
            macos9/people.c \
            macos9/people_feed.c \
            macos9/preferences.c \
            macos9/prefs_file.c \
            macos9/profile.c \
            macos9/profile_feed.c \
            macos9/scrollbar.c \
            macos9/secret.c \
            macos9/screen_state.c \
            macos9/state_panel.c \
            macos9/search.c \
            macos9/search_query.c \
            macos9/session.c \
            macos9/text_codec.c \
            macos9/textfield.c \
            macos9/thread.c \
            macos9/thread_feed.c \
            macos9/timeline.c \
            macos9/timeline_native.c \
            macos9/ui.c \
            macos9/test/test_apppw.c \
            macos9/test/test_avatar_cache.c \
            macos9/test/test_atproto_bootstrap.c \
            macos9/test/test_atproto_client.c \
            macos9/test/test_atproto_identity.c \
            macos9/test/test_atproto_prefs.c \
            macos9/test/test_atproto_session.c \
            macos9/test/test_atproto_url.c \
            macos9/test/test_bridge_client.c \
            macos9/test/test_diag.c \
            macos9/test/test_help.c \
            macos9/test/test_image_blob.c \
            macos9/test/test_image_encode.c \
            macos9/test/test_compose.c \
            macos9/test/test_json_min.c \
            macos9/test/test_muted_words.c \
            macos9/test/test_conversations.c \
            macos9/test/test_notifications.c \
            macos9/test/test_people.c \
            macos9/test/test_post_media.c \
            macos9/test/test_prefs.c \
            macos9/test/test_profile.c \
            macos9/test/test_search.c \
            macos9/test/test_screen_state.c \
            macos9/test/test_state_panel.c \
            macos9/test/test_secret.c \
            macos9/test/test_textfield.c \
            macos9/test/test_thread.c \
            macos9/test/test_timeline.c \
            macos9/test/test_ui.c \
            macos9/test/ui_stubs.c \
            macos9/test/wolfram_stub.c
          do
            for cc in clang gcc; do
              echo "--- $cc $f"
              # -Wno-multichar: 'PTLM' and 'PREF' are OSType literals, which
              # are multi-character constants by design on the Mac target.
              "$cc" -std=c89 -pedantic-errors -Wall -Wextra \
                -Wno-unused-parameter -Wno-multichar -Werror \
                -Wdeclaration-after-statement -Wstrict-prototypes -Wvla \
                -I macos9 -I macos9/test/sdk-stubs -I wolfram/include \
                -c "$f" -o /dev/null
            done
          done

      - name: Run the Mac-side tests
        # The transport itself cannot run here: it is built on Open Transport
        # and macTLS. These tests cover the client's own request building and
        # its handling of bridge responses by stubbing the Wolfram entry
        # points, which is what makes the pairing path testable at all.
        run: |
          set -euo pipefail
          CFLAGS=(
            -std=c89 -pedantic-errors -Wall -Wextra
            -Wno-unused-parameter -Werror
            -Wdeclaration-after-statement -Wstrict-prototypes -Wvla
            -I macos9 -I wolfram/include
          )
          clang "${CFLAGS[@]}" -o /tmp/test_json_min \
            macos9/json_min.c macos9/test/test_json_min.c
          /tmp/test_json_min
          clang "${CFLAGS[@]}" -o /tmp/test_atproto_url \
            macos9/atproto_url.c macos9/test/test_atproto_url.c
          /tmp/test_atproto_url
          clang "${CFLAGS[@]}" -o /tmp/test_atproto_identity \
            macos9/atproto_identity.c macos9/atproto_url.c macos9/json_min.c \
            macos9/test/test_atproto_identity.c
          /tmp/test_atproto_identity
          clang "${CFLAGS[@]}" -o /tmp/test_atproto_session \
            macos9/atproto_session.c macos9/atproto_url.c macos9/json_min.c \
            macos9/test/test_atproto_session.c
          /tmp/test_atproto_session
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_atproto_bootstrap \
            macos9/atproto_bootstrap.c macos9/atproto_identity.c \
            macos9/atproto_url.c macos9/json_min.c macos9/test/wolfram_stub.c \
            macos9/test/test_atproto_bootstrap.c
          /tmp/test_atproto_bootstrap
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_atproto_client \
            macos9/atproto_client.c macos9/atproto_bootstrap.c \
            macos9/atproto_identity.c macos9/atproto_session.c \
            macos9/atproto_url.c macos9/json_min.c macos9/test/wolfram_stub.c \
            macos9/test/test_atproto_client.c
          /tmp/test_atproto_client
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_avatar_cache \
            macos9/avatar_cache.c macos9/image_blob.c macos9/json_min.c \
            macos9/test/test_avatar_cache.c
          /tmp/test_avatar_cache
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_bridge_client \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_bridge_client.c
          /tmp/test_bridge_client
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_timeline \
            macos9/timeline.c macos9/timeline_native.c macos9/atproto_prefs.c \
            macos9/muted_words.c macos9/post_media.c \
            macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/atproto_feed.c macos9/atproto_client.c \
            macos9/atproto_bootstrap.c macos9/atproto_identity.c \
            macos9/atproto_session.c macos9/atproto_url.c \
            macos9/test/wolfram_stub.c macos9/test/test_timeline.c
          /tmp/test_timeline
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_notifications \
            macos9/notifications_feed.c macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/atproto_feed.c macos9/atproto_client.c \
            macos9/atproto_bootstrap.c macos9/atproto_identity.c \
            macos9/atproto_session.c macos9/atproto_url.c \
            macos9/test/wolfram_stub.c macos9/test/test_notifications.c
          /tmp/test_notifications
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_conversations \
            macos9/conversations_feed.c macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_conversations.c
          /tmp/test_conversations
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_ui \
            macos9/ui.c macos9/timeline.c macos9/post_media.c \
            macos9/text_codec.c macos9/state_panel.c \
            macos9/screen_state.c macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/ui_stubs.c \
            macos9/test/test_ui.c
          /tmp/test_ui
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_thread \
            macos9/thread_feed.c macos9/timeline.c macos9/post_media.c \
            macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_thread.c
          /tmp/test_thread
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_textfield \
            macos9/textfield.c macos9/test/test_textfield.c
          /tmp/test_textfield
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_apppw \
            macos9/apppw_input.c macos9/text_codec.c macos9/test/test_apppw.c
          /tmp/test_apppw
          clang "${CFLAGS[@]}" -o /tmp/test_muted_words \
            macos9/muted_words.c macos9/test/test_muted_words.c
          /tmp/test_muted_words
          clang "${CFLAGS[@]}" -I macos9/test -o /tmp/test_atproto_prefs \
            macos9/atproto_prefs.c macos9/muted_words.c macos9/json_min.c \
            macos9/atproto_client.c macos9/atproto_bootstrap.c \
            macos9/atproto_identity.c macos9/atproto_session.c \
            macos9/atproto_url.c macos9/test/wolfram_stub.c \
            macos9/test/test_atproto_prefs.c
          /tmp/test_atproto_prefs
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_screen_state \
            macos9/screen_state.c macos9/test/test_screen_state.c
          /tmp/test_screen_state
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_state_panel \
            macos9/state_panel.c macos9/screen_state.c \
            macos9/test/ui_stubs.c macos9/test/test_state_panel.c
          /tmp/test_state_panel
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_help \
            macos9/help.c macos9/state_panel.c macos9/screen_state.c \
            macos9/test/ui_stubs.c macos9/test/test_help.c
          /tmp/test_help
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_secret \
            macos9/secret.c macos9/text_codec.c macos9/bridge_client.c \
            macos9/json_min.c macos9/test/wolfram_stub.c macos9/test/test_secret.c
          /tmp/test_secret
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_search \
            macos9/search_query.c macos9/text_codec.c macos9/test/test_search.c
          /tmp/test_search
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_compose \
            macos9/compose_model.c macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_compose.c
          /tmp/test_compose
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_image_blob \
            macos9/image_blob.c macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_image_blob.c
          /tmp/test_image_blob
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_image_encode \
            macos9/image_encode.c macos9/image_blob.c \
            macos9/test/test_image_encode.c
          /tmp/test_image_encode
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_diag \
            macos9/diag.c macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_diag.c
          /tmp/test_diag
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_prefs \
            macos9/prefs_file.c macos9/config.c macos9/draft.c \
            macos9/test/test_prefs.c
          /tmp/test_prefs
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_profile \
            macos9/profile_feed.c macos9/timeline.c macos9/post_media.c \
            macos9/text_codec.c \
            macos9/bridge_client.c macos9/json_min.c \
            macos9/test/wolfram_stub.c macos9/test/test_profile.c
          /tmp/test_profile
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_people \
            macos9/people_feed.c macos9/text_codec.c macos9/bridge_client.c \
            macos9/json_min.c macos9/test/wolfram_stub.c \
            macos9/test/test_people.c
          /tmp/test_people
          clang "${CFLAGS[@]}" -I macos9/test -I macos9/test/sdk-stubs \
            -o /tmp/test_post_media \
            macos9/post_media.c macos9/text_codec.c macos9/json_min.c \
            macos9/test/test_post_media.c
          /tmp/test_post_media

  # Builds the release inputs exactly as a real release would, publishes
  # nothing, and checks them with the updater's own parser, so the first real
  # release is one command. Releases themselves are paused (RELEASES_PAUSED).
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package.json

      # verify-release.mts checks the inputs with the updater's own parser,
      # which runs in Wolfram's C through the Node addon, so build it from the
      # same pinned commit as the bridge job above.
      - name: Install the C toolchain for Wolfram's addon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libsecp256k1-dev
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: bfb50126b2943741fc5bccc931aa20baa54e445a
          path: wolfram
      - name: Build Wolfram's Node addon
        run: tools/build-addon.sh wolfram

      - name: Build release inputs without tagging or publishing
        run: |
          version=$(node -p "require('./bridge/package.json').version")
          scripts/release.sh --dry-run "$version"
          (cd bridge && node --import tsx ../scripts/verify-release.mts "$version")

  # Builds the real Mac OS 9 application with Retro68. The prebuilt image,
  # pinned by digest, contains both complete toolchains, so nothing is
  # compiled here except Platinum itself. This is the only job that compiles
  # the sources against real Classic Mac OS interfaces rather than the host
  # stubs; the resources in icon.r are compiled by the resource compiler.
  # The Wolfram transport cannot be built here — that needs Open Transport
  # and macTLS (#41) — so the application links the test transport stub: it
  # proves the application compiles, links and carries its resources, not
  # that it runs or reaches the bridge (no emulator or hardware in CI).
  macos9-build:
    name: Mac OS 9 application (Retro68)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autc04/retro68@sha256:2c2ec5ca764c98b7460522be7327426e3b4d039a317c22d6ccdcc64e5247f21a
    env:
      # The deterministic fixture for the QEMU runtime layer. It is never part
      # of a release; this only proves it builds for both CPUs.
      PLATINUM_BUILD_FIXTURE: "ON"
    steps:
      - uses: actions/checkout@v5

      # The same pinned Wolfram headers as the C89 job.
      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: v0.36.2
          path: wolfram

      - name: Build for 68k
        run: tools/build-macos9.sh 68k

      - name: Build for PowerPC
        run: tools/build-macos9.sh ppc

      - name: Check the fixture application was built
        run: |
          ls build-macos9-ppc
          test -f build-macos9-ppc/PlatinumFixture.bin

  # The native bridge under native/ is C, not the TypeScript service the bridge
  # job runs, and no other job compiles it: without this one a change to a
  # Wolfram header or to the C89 parts could reach main without a build. It
  # links Wolfram's host library, so the SDK is checked out at a commit and
  # built first. A commit rather than a branch, because a job that follows main
  # stops being reproducible the day main changes; bumping the pin is a
  # deliberate change and updates the note in AGENTS.md and README.md in the
  # same commit.
  #
  # This builds and runs the C parts and the Wolfram-backed routes against a
  # mock PDS on the loopback interface. It is a host build: not a Mac OS 9 run,
  # not a live PDS, and no hardware.
  native-bridge:
    name: Native bridge (C)
    runs-on: ubuntu-latest
    env:
      WOLFRAM_ROOT: ${{ github.workspace }}/wolfram
    steps:
      - uses: actions/checkout@v5

      - name: Install the C toolchain and the bridge's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libsecp256k1-dev \
            libcjson-dev libmicrohttpd-dev

      - uses: actions/checkout@v5
        with:
          repository: ewanc26/wolfram
          ref: 7d81119781bac700957bb02ec807b2c1a2c8198f
          path: wolfram

      - name: Build Wolfram's host library
        run: |
          cmake -S wolfram -B "$WOLFRAM_ROOT/build-host" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOLFRAM_BUILD_TESTS=OFF \
            -DWOLFRAM_BUILD_EXAMPLES=OFF
          cmake --build "$WOLFRAM_ROOT/build-host" --target wolfram -j"$(nproc)"

      # libcjson-dev installs /usr/include/cjson/cJSON.h and libmicrohttpd-dev
      # /usr/include/microhttpd.h, which is what CJSON_PREFIX=/usr means to the
      # Makefile. WOLFRAM_HOST_BUILD defaults to $(WOLFRAM_ROOT)/build-host.
      - name: The C89 parts build and pass
        working-directory: native/bridge
        env:
          CJSON_PREFIX: /usr
        run: make test

      - name: The Wolfram-backed routes answer against a mock PDS
        working-directory: native/bridge
        env:
          CJSON_PREFIX: /usr
        run: |
          make test_server test_conversations
          ./test_server
          ./test_conversations

  # The one check branch protection should require. Requiring the individual
  # jobs would let a renamed or added job silently drop out of the gate; this
  # job fails unless every job it needs succeeded, and the drift check fails if
  # a job is not listed here.
  gate:
    name: CI gate
    if: always()
    needs: [flow, bridge, macos9, macos9-build, native-bridge, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job did not succeed"; exit 1; }
          done
