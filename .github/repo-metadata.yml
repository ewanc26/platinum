# Repository metadata: description, homepage, topics and features. `core` is
# identical in all five repos and drift-checked against Wolfram's copy; `repo`
# is Platinum's own. The owner applies it with Wolfram's
# tools/apply-repo-metadata.sh; until `enforce_live` is true CI only warns about
# live differences.
core:
  topics: [at-protocol, atproto, bluesky, c]
  has_wiki: false          # docs/ is the source of truth
  has_discussions: false
  has_projects: false
repo:
  description: "A Bluesky client for Classic Mac OS 9, with a small Node bridge doing the parts a 1990s operating system can't."
  homepage: ""
  topics: [classic-mac, classic-mac-os, codewarrior, mac-os-9, macintosh, mactls, open-transport, retrocomputing, social-networking, c89, nodejs]
  enforce_live: true
