name: Bug report
description: Something behaves differently from what the docs or code say
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
    validations: {required: true}
  - type: input
    id: where
    attributes:
      label: Where it ran
      description: Real Mac OS 9 hardware, an emulator, or the bridge only. Say which.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations: {required: true}
